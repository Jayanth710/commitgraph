[project]
name = "backend"
version = "0.1.0"
description = "CommitGraph backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "cryptography>=46.0.5",
    "litellm>=1.60.0",
    "langgraph>=0.4.0",
    "upstash-redis>=1.7.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*", "scheduler*"]

[tool.ruff]
line-length = 100
