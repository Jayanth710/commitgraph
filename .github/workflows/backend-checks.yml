name: Backend Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Install backend deps
        run: pip install -e .

      - name: Ruff
        run: ruff check .

      - name: Compile check
        run: python -m compileall app worker scheduler

      - name: Tests
        run: pytest