version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: commitgraph-postgres
    environment:
      POSTGRES_DB: commitgraph
      POSTGRES_USER: commitgraph
      POSTGRES_PASSWORD: commitgraph
    ports:
      - "5432:5432"
    volumes:
      - commitgraph_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./backend/migrations/002_users.sql:/docker-entrypoint-initdb.d/002_users.sql:ro
      - ./backend/migrations/003_priority.sql:/docker-entrypoint-initdb.d/003_priority.sql:ro
      - ./backend/migrations/004_calendar_event_id.sql:/docker-entrypoint-initdb.d/004_calendar_event_id.sql:ro
      - ./backend/migrations/005_calendar_event_link.sql:/docker-entrypoint-initdb.d/005_calendar_event_link.sql:ro
      - ./backend/migrations/006_job_applications.sql:/docker-entrypoint-initdb.d/006_job_applications.sql:ro
      - ./backend/migrations/007_daily_briefs.sql:/docker-entrypoint-initdb.d/007_daily_briefs.sql:ro
      - ./backend/migrations/008_brief_delivery.sql:/docker-entrypoint-initdb.d/008_brief_delivery.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitgraph -d commitgraph"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: commitgraph-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - commitgraph_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commitgraph-api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://commitgraph:commitgraph@postgres:5432/commitgraph
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-normalizer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commitgraph-worker-normalizer
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://commitgraph:commitgraph@postgres:5432/commitgraph
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      STREAM_NORMALIZER_CONSUMER: normalizer-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "worker.main", "normalizer"]

  worker-extractor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commitgraph-worker-extractor
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://commitgraph:commitgraph@postgres:5432/commitgraph
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      STREAM_EXTRACTOR_CONSUMER: extractor-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "worker.main", "extractor"]

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commitgraph-scheduler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://commitgraph:commitgraph@postgres:5432/commitgraph
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scheduler.main"]
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commitgraph-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: commitgraph-ngrok
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      api:
        condition: service_healthy
    command: ["http", "api:8000", "--log=stdout"]
    ports:
      - "4040:4040"

volumes:
  commitgraph_postgres_data:
  commitgraph_redis_data:
